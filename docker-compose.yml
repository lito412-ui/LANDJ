services:
  # Servidor Web Nginx
  web:
    image: nginx:alpine
    container_name: mi_servidor_web_2
    ports:
      - "91:80" # Cambiado a 91 (el otro era 90 u 80)
    volumes:
      - .:/usr/share/nginx/html
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - db
      - php
    networks:
      - red_proyecto_2

  # Servicio de PHP-FPM
  php:
    build: . 
    container_name: mi_php_fpm_2
    volumes:
      - .:/usr/share/nginx/html
    networks:
      - red_proyecto_2

  # Base de Datos MySQL
  db:
    image: mysql:8.4
    container_name: mi_base_datos_2
    restart: always
    command: --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: "lolito412/"
      MYSQL_DATABASE: mi_proyecto_db
    ports:
      - "3307:3306" # Cambiado a 3307 para no chocar con el 3306 del otro
    volumes:
      - db_data_2:/var/lib/mysql
    networks:
      - red_proyecto_2

  # Administrador de BD (Interfaz Web)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mi_administrador_pma_2
    restart: always
    ports:
      - "8082:80" # Usamos el 8082 ya que el 8080 y 8081 están ocupados
    environment:
      - PMA_HOST=db
      - MYSQL_ROOT_PASSWORD=lolito412/
    depends_on:
      - db
    networks:
      - red_proyecto_2
  # Monitorización
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - red_proyecto_2
volumes:
  db_data_2:

networks:
  red_proyecto_2:
    driver: bridge
