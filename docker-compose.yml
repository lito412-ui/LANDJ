services:
  # Servidor Web Nginx
  web:
    image: nginx:alpine
    container_name: mi_servidor_web_2
    ports:
      - "${PORT_WEB:-91}:80"
    volumes:
      - .:/usr/share/nginx/html
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
    depends_on:
      php:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - red_proyecto_2

  # Servicio de PHP-FPM
  php:
    build: .
    container_name: mi_php_fpm_2
    command: >
      sh -c "cd /usr/share/nginx/html &&
             composer install --no-dev --no-interaction --quiet &&
             php-fpm"
    volumes:
      - .:/usr/share/nginx/html
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-landj_db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_proyecto_2

  migrate:
    build: .
    container_name: mi_migrate_2
    command: ["php", "/usr/share/nginx/html/database/migrate.php"]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-landj_db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - .:/usr/share/nginx/html
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - red_proyecto_2

  # Tareas periodicas (recordatorios de cobro de facturas vencidas)
  cron:
    build: .
    container_name: mi_cron_2
    command: >
      sh -c "while true; do
               php /usr/share/nginx/html/database/tareas/recordatorios_facturas.php;
               php /usr/share/nginx/html/database/tareas/generar_facturas_recurrentes.php;
               sleep ${CRON_INTERVALO_SEGUNDOS:-3600};
             done"
    volumes:
      - .:/usr/share/nginx/html
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-landj_db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - red_proyecto_2

  # Base de Datos MySQL
  db:
    image: mysql:8.4
    container_name: mi_base_datos_2
    restart: always
    command: --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-landj_secret_db_pass_2026}"
      MYSQL_DATABASE: ${DB_NAME:-landj_db}
    ports:
      - "127.0.0.1:${PORT_DB:-3307}:3306"
    volumes:
      - db_data_2:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - red_proyecto_2

  # Administrador de BD (Interfaz Web)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mi_administrador_pma_2
    restart: always
    ports:
      - "127.0.0.1:${PORT_PMA:-8082}:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_USER=${DB_USER:-root}
      - PMA_PASSWORD=${DB_PASSWORD:-landj_secret_db_pass_2026}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-landj_secret_db_pass_2026}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_proyecto_2

  # Monitorización
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "127.0.0.1:${PORT_CADVISOR:-8080}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - red_proyecto_2

volumes:
  db_data_2:

networks:
  red_proyecto_2:
    driver: bridge
