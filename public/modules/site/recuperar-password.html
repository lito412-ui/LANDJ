<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/site/style.css">
    <link rel="icon" type="image/png" href="/assets/img/icono web.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <title>L&J CRM — Recuperar Contraseña</title>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1 class="logo">L&J</h1>
                <p class="subtitle" id="stepSubtitle">Recuperar acceso a tu cuenta</p>
            </div>

            <div id="alertBox" class="auth-alert" role="alert">
                <i class="fas fa-info-circle" id="alertIcon"></i>
                <span id="alertText"></span>
            </div>

            <!-- ── PASO 1: SOLICITAR CÓDIGO ──────────────────────────────── -->
            <form id="formSolicitar" class="login-form">
                <p style="color: #6b7280; font-size: 0.88rem; line-height: 1.5; margin-bottom: 5px;">
                    Introduce tu nombre de usuario o correo electrónico. Te enviaremos un código de seguridad para restablecer tu clave.
                </p>

                <div class="input-group">
                    <label for="recupIdentificador" class="input-label">Usuario o Correo</label>
                    <input 
                        type="text" 
                        id="recupIdentificador" 
                        class="input-field" 
                        placeholder="tu_usuario o tu@correo.com" 
                        required 
                        autocomplete="username"
                        autofocus
                    >
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="btnSolicitar">
                        <i class="fas fa-paper-plane"></i> Enviar Código de Recuperación
                    </button>
                </div>

                <div class="auth-links">
                    <p>
                        <a href="/modules/site/login.html" class="auth-link"><i class="fas fa-arrow-left"></i> Volver a Iniciar Sesión</a>
                    </p>
                </div>
            </form>

            <!-- ── PASO 2: INTRODUCIR CÓDIGO Y NUEVA CONTRASEÑA ───────────── -->
            <form id="formRestablecer" class="login-form" style="display: none;">
                <p style="color: #4b5563; font-size: 0.88rem; text-align: center; margin-bottom: 5px;">
                    Introduce el código enviado a:<br>
                    <strong id="txtEmailOfuscado" style="color: #667eea;"></strong>
                </p>

                <div class="input-group">
                    <label class="input-label" style="text-align: center;">Código de 6 dígitos</label>
                    <input 
                        type="text" 
                        id="resetCodigo" 
                        class="input-field auth-code-input" 
                        placeholder="000000" 
                        required 
                        maxlength="6"
                        pattern="[0-9]{6}"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        autofocus
                    >
                    <span class="auth-hint" style="text-align: center;">Válido durante 15 minutos</span>
                </div>

                <div class="input-group">
                    <label for="resetPass1" class="input-label">Nueva Contraseña</label>
                    <input 
                        type="password" 
                        id="resetPass1" 
                        class="input-field" 
                        placeholder="Mínimo 8 caracteres (letras y números)" 
                        required 
                        autocomplete="new-password"
                        minlength="8"
                    >
                </div>

                <div class="input-group">
                    <label for="resetPass2" class="input-label">Confirmar Nueva Contraseña</label>
                    <input 
                        type="password" 
                        id="resetPass2" 
                        class="input-field" 
                        placeholder="Repite la nueva contraseña" 
                        required 
                        autocomplete="new-password"
                        minlength="8"
                    >
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="btnRestablecer">
                        <i class="fas fa-key"></i> Cambiar Contraseña
                    </button>
                </div>

                <div class="auth-links">
                    <p>
                        <button type="button" id="btnVolverPaso1" class="btn-secondary-link">
                            <i class="fas fa-redo"></i> Solicitar otro código
                        </button>
                    </p>
                    <p style="margin-top: 10px;">
                        <a href="/modules/site/login.html" class="auth-link auth-link-subtle"><i class="fas fa-arrow-left"></i> Volver a Iniciar Sesión</a>
                    </p>
                </div>
            </form>

        </div>
    </div>

    <script>
        (function() {
            const formSolicitar   = document.getElementById('formSolicitar');
            const formRestablecer = document.getElementById('formRestablecer');
            const stepSubtitle    = document.getElementById('stepSubtitle');
            const alertBox        = document.getElementById('alertBox');
            const alertText       = document.getElementById('alertText');
            const alertIcon       = document.getElementById('alertIcon');
            const txtEmailOfuscado = document.getElementById('txtEmailOfuscado');
            const btnSolicitar    = document.getElementById('btnSolicitar');
            const btnRestablecer  = document.getElementById('btnRestablecer');
            const btnVolverPaso1  = document.getElementById('btnVolverPaso1');

            let currentIdentificador = '';

            function showAlert(msg, isOk = false) {
                alertText.textContent = msg;
                alertBox.className = 'auth-alert ' + (isOk ? 'auth-alert--ok' : 'auth-alert--err') + ' show';
                alertIcon.className = isOk ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
            }

            function hideAlert() {
                alertBox.className = 'auth-alert';
            }

            // Paso 1: Enviar solicitud de código
            formSolicitar.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideAlert();

                const idVal = document.getElementById('recupIdentificador').value.trim();
                if (!idVal) return;

                btnSolicitar.disabled = true;
                btnSolicitar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';

                try {
                    const res = await fetch('/api/auth.php?accion=solicitar-recuperacion', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ identificador: idVal })
                    });

                    const data = await res.json();
                    if (data.ok) {
                        currentIdentificador = data.data.identificador || idVal;
                        txtEmailOfuscado.textContent = data.data.email_ofuscado || 'tu correo registrado';
                        showAlert('✓ Si la cuenta existe, se ha enviado el código a su correo.', true);

                        formSolicitar.style.display = 'none';
                        formRestablecer.style.display = 'flex';
                        stepSubtitle.textContent = 'Establecer Nueva Clave';
                        document.getElementById('resetCodigo').focus();
                    } else {
                        showAlert(data.error || 'Error al procesar la solicitud', false);
                    }
                } catch (err) {
                    showAlert('Error de red: ' + err.message, false);
                } finally {
                    btnSolicitar.disabled = false;
                    btnSolicitar.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar Código de Recuperación';
                }
            });

            // Paso 2: Restablecer contraseña con el código
            formRestablecer.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideAlert();

                const codigo = document.getElementById('resetCodigo').value.trim();
                const pass1  = document.getElementById('resetPass1').value;
                const pass2  = document.getElementById('resetPass2').value;

                if (codigo.length < 6) {
                    showAlert('El código debe tener 6 dígitos', false);
                    return;
                }
                if (pass1 !== pass2) {
                    showAlert('Las contraseñas no coinciden', false);
                    return;
                }

                btnRestablecer.disabled = true;
                btnRestablecer.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Actualizando...';

                try {
                    const res = await fetch('/api/auth.php?accion=restablecer-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            identificador:  currentIdentificador,
                            codigo:         codigo,
                            nueva_password: pass1
                        })
                    });

                    const data = await res.json();
                    if (data.ok) {
                        showAlert('✓ ' + data.data.message, true);
                        setTimeout(() => {
                            window.location.href = data.data.redirect || '/admin/cpanel.php';
                        }, 1200);
                    } else {
                        showAlert(data.error || 'Código incorrecto o caducado', false);
                    }
                } catch (err) {
                    showAlert('Error de red: ' + err.message, false);
                } finally {
                    btnRestablecer.disabled = false;
                    btnRestablecer.innerHTML = '<i class="fas fa-key"></i> Cambiar Contraseña';
                }
            });

            btnVolverPaso1.addEventListener('click', () => {
                hideAlert();
                formRestablecer.style.display = 'none';
                formSolicitar.style.display = 'flex';
                stepSubtitle.textContent = 'Recuperar acceso a tu cuenta';
            });
        })();
    </script>
</body>
</html>
