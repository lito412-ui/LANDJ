<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" type="image/png" href="./img/logo_proyecto.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>L&J - Iniciar Sesión</title>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1 class="logo">L&J</h1>
                <p class="subtitle">Bienvenido de vuelta</p>
            </div>

            <form class="login-form" action="auth/login.php" method="POST" id="loginForm">
                <div class="input-group">
                    <label for="username" class="input-label">Nombre de Usuario</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="input-field"
                        placeholder="Ingresa tu nombre de usuario"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password" class="input-label">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="input-field"
                        placeholder="Ingresa tu contraseña"
                        required
                    >
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">
                        Iniciar Sesión
                    </button>
                </div>

                <!--<div class="form-footer">
                    <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>-->
            </form>
        </div>
    </div>
</body>
</html>
